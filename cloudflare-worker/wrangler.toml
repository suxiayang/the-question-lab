name = "tql-interrogate"
main = "worker.js"
compatibility_date = "2025-04-01"

# Optional: limit script CPU time. Anthropic responses come back well under 10s
# but we leave the default (30s on the free tier) so the user does not need to
# touch billing.

# Logs (free, opt-in). Useful while debugging.
[observability]
enabled = true
